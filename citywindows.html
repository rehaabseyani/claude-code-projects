<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City Windows</title>
<!--
  City Windows — a first-person window view into five cities.
  All visuals are procedural (canvas + CSS), all audio is synthesized
  live with the Web Audio API. No external assets, no build step.
-->
<style>
  :root{
    --frame-thick: clamp(16px, 3vw, 46px);
    --mullion-thick: clamp(10px, 1.7vw, 26px);
    --sill-thick: clamp(26px, 4.2vw, 64px);
    --frame-grad: linear-gradient(135deg, #4a3524 0%, #6b4a30 35%, #3c2a1b 70%, #2a1c12 100%);
    --ui-bg: rgba(12, 14, 18, 0.55);
    --ui-fg: #f2ede4;
    --ui-accent: #e8c07a;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:#05060a; color:var(--ui-fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  button{ font-family:inherit; }
  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* ---------- Landing screen ---------- */
  #landing{
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(20px,4vh,48px);
    background:#ffffff;
    transition: opacity .7s ease, transform .7s ease, visibility 0s linear 0s;
    padding: calc(24px + var(--safe-t)) calc(20px + var(--safe-r)) calc(24px + var(--safe-b)) calc(20px + var(--safe-l));
  }
  #landing.hidden{
    opacity:0; transform:scale(1.03); pointer-events:none; visibility:hidden;
    transition: opacity .7s ease, transform .7s ease, visibility 0s linear .7s;
  }
  .landing-header{ text-align:center; max-width:640px; }
  .landing-header h1{
    margin:0 0 8px; font-size:clamp(28px,5vw,44px); font-weight:600; letter-spacing:.01em;
    color:#141414;
  }
  .landing-header p{
    margin:0; color:#5a5a62; font-size:clamp(13px,1.6vw,16px); line-height:1.5;
  }
  .city-strip{
    display:flex; flex-wrap:wrap; justify-content:center; gap:clamp(14px,2vw,26px);
    max-width:1180px; width:100%;
  }
  .city-card{
    position:relative; width:clamp(150px,26vw,230px); aspect-ratio:3/4;
    border-radius:14px; border:1px solid rgba(0,0,0,.08);
    background:#0c0f16; color:#fff; cursor:pointer; overflow:hidden;
    padding:0; text-align:left;
    transform: translateY(0) scale(1);
    transition: transform .35s cubic-bezier(.2,.8,.3,1), box-shadow .35s ease, border-color .35s ease;
    box-shadow: 0 8px 22px rgba(20,20,30,.14);
  }
  .city-card:hover, .city-card:focus-visible{
    transform: translateY(-8px) scale(1.03);
    border-color: rgba(0,0,0,.18);
    box-shadow: 0 18px 36px rgba(20,20,30,.22);
    outline: none;
  }
  .city-card:focus-visible{ box-shadow: 0 18px 36px rgba(20,20,30,.22), 0 0 0 3px var(--ui-accent); }
  @media (min-width: 860px){
    .city-strip{
      flex-wrap:nowrap;
      max-width:min(1760px,94vw);
      gap:clamp(16px,1.6vw,30px);
    }
    .city-card{ width:auto; flex:1 1 0; max-width:340px; }
  }
  .teaser{
    position:absolute; inset:0; background-size:220% 220%; background-position:30% 40%;
    transition: background-position .8s ease;
  }
  .city-card:hover .teaser, .city-card:focus-visible .teaser{ background-position:70% 60%; }
  .teaser.sydney{ background-image: linear-gradient(200deg,#12324a,#1f6f97 45%,#bfe3ee 100%); }
  .teaser.dubai{ background-image: linear-gradient(200deg,#3a1f12,#c47a2e 45%,#ffe2ad 100%); }
  .teaser.dc{ background-image: linear-gradient(200deg,#1a2233,#3a5170 45%,#dce7ef 100%); }
  .teaser.philly{ background-image: linear-gradient(200deg,#251a2e,#5c3d63 45%,#f0c9d8 100%); }
  .teaser.karachi{ background-image: linear-gradient(200deg,#241a12,#8a5a2e 45%,#ffd9a0 100%); }
  .teaser::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:46%;
    background: rgba(3,4,8,.55);
    transition: transform .5s ease;
  }
  .city-card:hover .teaser::after, .city-card:focus-visible .teaser::after{ transform: translateY(-4%); }
  .teaser.sydney::after{ clip-path: polygon(0% 100%,0% 60%,8% 60%,8% 38%,14% 38%,14% 55%,22% 20%,26% 55%,34% 42%,40% 60%,40% 30%,46% 30%,46% 60%,58% 45%,64% 60%,64% 40%,70% 40%,70% 65%,80% 50%,86% 65%,100% 65%,100% 100%); }
  .teaser.dubai::after{ clip-path: polygon(0% 100%,0% 70%,10% 70%,10% 55%,18% 55%,18% 65%,28% 65%,28% 8%,31% 4%,34% 8%,34% 65%,44% 65%,44% 45%,52% 45%,52% 65%,62% 65%,62% 30%,68% 30%,68% 65%,78% 65%,78% 50%,86% 50%,86% 65%,100% 65%,100% 100%); }
  .teaser.dc::after{ clip-path: polygon(0% 100%,0% 72%,14% 72%,14% 60%,26% 60%,26% 46%,30% 34%,34% 46%,34% 60%,46% 60%,46% 72%,54% 72%,54% 18%,57% 18%,57% 72%,66% 72%,66% 62%,78% 62%,78% 72%,100% 72%,100% 100%); }
  .teaser.philly::after{ clip-path: polygon(0% 100%,0% 68%,10% 60%,16% 68%,22% 55%,28% 68%,34% 68%,34% 26%,38% 20%,40% 14%,42% 20%,46% 26%,46% 68%,58% 68%,58% 56%,66% 56%,66% 68%,76% 60%,82% 68%,100% 68%,100% 100%); }
  .teaser.karachi::after{ clip-path: polygon(0% 100%,0% 66%,8% 66%,8% 20%,10% 12%,12% 20%,12% 66%,22% 66%,22% 50%,32% 50%,32% 66%,44% 66%,44% 58%,50% 58%,50% 15%,52% 8%,54% 15%,54% 58%,60% 58%,60% 66%,72% 66%,72% 46%,80% 46%,80% 66%,90% 66%,90% 54%,100% 54%,100% 100%); }
  .card-content{
    position:absolute; left:0; right:0; bottom:0; padding:14px 16px 16px;
    display:flex; flex-direction:column; gap:2px;
  }
  .card-name{ font-size:clamp(16px,2vw,20px); font-weight:600; text-shadow:0 2px 8px rgba(0,0,0,.6); }
  .card-sub{ font-size:12px; color:#dfe4ea; opacity:.85; text-shadow:0 1px 4px rgba(0,0,0,.6); }

  /* ---------- Window experience ---------- */
  #experience{
    position:fixed; inset:0; z-index:10; opacity:0; transform:scale(1.02);
    pointer-events:none; visibility:hidden;
    transition: opacity .8s ease, transform .8s ease, visibility 0s linear .8s;
  }
  #experience.visible{
    opacity:1; transform:scale(1); pointer-events:auto; visibility:visible;
    transition: opacity .8s ease, transform .8s ease, visibility 0s linear 0s;
  }
  #window-rig{ position:absolute; inset:0; overflow:hidden; background:#000; }
  canvas.scene-canvas{
    position:absolute; inset:0; width:100%; height:100%; display:block;
  }
  #sceneB{ opacity:0; }

  .glass-fx{ position:absolute; inset:0; overflow:hidden; z-index:4; }
  .glass-reflection{
    position:absolute; inset:-10%; pointer-events:none;
    background:linear-gradient(115deg, transparent 22%, rgba(255,255,255,.11) 40%, rgba(255,255,255,.03) 48%, transparent 62%);
    mix-blend-mode:screen;
    animation: reflectionDrift 46s ease-in-out infinite alternate;
  }
  @keyframes reflectionDrift{ from{ transform:translate(-4%,-2%); } to{ transform:translate(4%,3%); } }
  .glass-grime{
    position:absolute; inset:0; pointer-events:none; opacity:.75;
    background:
      radial-gradient(circle at 10% 82%, rgba(255,255,255,.05), transparent 7%),
      radial-gradient(circle at 88% 12%, rgba(255,255,255,.045), transparent 6%),
      radial-gradient(circle at 72% 92%, rgba(0,0,0,.06), transparent 9%),
      radial-gradient(circle at 4% 30%, rgba(255,255,255,.03), transparent 8%);
  }
  .rain-layer{ position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .8s ease; }
  .rain-layer.on{ opacity:1; }
  .drop{
    position:absolute; top:-10%; width:3px; height:26px; border-radius:40%;
    background:linear-gradient(rgba(255,255,255,.02), rgba(255,255,255,.35), rgba(255,255,255,.02));
    filter:blur(.3px); animation:dropFall linear infinite;
  }
  @keyframes dropFall{ from{ transform:translateY(-10%); } to{ transform:translateY(115vh); } }

  .vignette{
    position:absolute; inset:0; pointer-events:none; z-index:3;
    box-shadow: inset 0 0 9vw 2vw rgba(0,0,0,.5), inset 0 0 20vw 7vw rgba(0,0,0,.32);
  }

  .frame{ position:absolute; inset:0; pointer-events:none; z-index:5; }
  .bar{ position:absolute; background:var(--frame-grad); }
  .bar.top{ top:0; left:0; right:0; height:var(--frame-thick); box-shadow: inset 0 -3px 6px rgba(0,0,0,.5), inset 0 2px 3px rgba(255,255,255,.12), 0 4px 14px rgba(0,0,0,.45); }
  .bar.left{ top:0; bottom:0; left:0; width:var(--frame-thick); box-shadow: inset -3px 0 6px rgba(0,0,0,.5), inset 2px 0 3px rgba(255,255,255,.1), 4px 0 14px rgba(0,0,0,.4); }
  .bar.right{ top:0; bottom:0; right:0; width:var(--frame-thick); box-shadow: inset 3px 0 6px rgba(0,0,0,.5), inset -2px 0 3px rgba(255,255,255,.1), -4px 0 14px rgba(0,0,0,.4); }
  .bar.sill{ bottom:0; left:0; right:0; height:var(--sill-thick); box-shadow: inset 0 4px 5px rgba(255,255,255,.16), inset 0 -4px 8px rgba(0,0,0,.55), 0 -6px 18px rgba(0,0,0,.4); }
  .mullion-v{
    position:absolute; top:var(--frame-thick); bottom:var(--sill-thick); width:var(--mullion-thick);
    margin-left:calc(var(--mullion-thick) / -2); background:var(--frame-grad);
    box-shadow: inset -2px 0 4px rgba(0,0,0,.45), inset 2px 0 3px rgba(255,255,255,.12), 0 0 10px rgba(0,0,0,.3);
  }
  .mullion-v.v1{ left:33.333%; }
  .mullion-v.v2{ left:66.666%; }
  .mullion-h{
    position:absolute; left:var(--frame-thick); right:var(--frame-thick); top:50%; height:var(--mullion-thick);
    margin-top:calc(var(--mullion-thick) / -2); background:var(--frame-grad);
    box-shadow: inset 0 -2px 4px rgba(0,0,0,.45), inset 0 2px 3px rgba(255,255,255,.12), 0 0 10px rgba(0,0,0,.3);
  }

  /* ---------- UI ---------- */
  .ui-layer{ position:absolute; inset:0; z-index:10; pointer-events:none; }
  .ui-layer > *{ pointer-events:auto; }
  .ui-top{
    position:absolute; top:calc(10px + var(--safe-t)); left:calc(10px + var(--safe-l)); right:calc(10px + var(--safe-r));
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .ui-btn{
    background:var(--ui-bg); color:var(--ui-fg); border:1px solid rgba(255,255,255,.18);
    border-radius:999px; padding:8px 14px; font-size:13px; cursor:pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display:flex; align-items:center; gap:6px; transition: background .2s ease, transform .2s ease;
  }
  .ui-btn:hover{ background:rgba(30,32,40,.7); }
  .ui-btn:active{ transform:scale(.96); }
  .ui-btn[aria-pressed="true"]{ border-color: var(--ui-accent); color: var(--ui-accent); }
  .ui-btn:focus-visible{ outline:2px solid var(--ui-accent); outline-offset:2px; }

  .back-group{ display:flex; align-items:center; gap:10px; }
  .city-title{ font-size:14px; font-weight:600; text-shadow:0 1px 4px rgba(0,0,0,.6); }

  .city-switcher{ display:flex; gap:6px; background:var(--ui-bg); padding:6px; border-radius:999px; border:1px solid rgba(255,255,255,.14); backdrop-filter:blur(6px); }
  .dot-btn{
    width:30px; height:30px; border-radius:50%; border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.06); color:#e8e8e8; font-size:11px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-weight:700;
  }
  .dot-btn[aria-current="true"]{ background:var(--ui-accent); color:#241a08; border-color:var(--ui-accent); }
  .dot-btn:focus-visible{ outline:2px solid var(--ui-accent); outline-offset:2px; }

  .ui-bottom{
    position:absolute; bottom:calc(10px + var(--safe-b)); left:calc(10px + var(--safe-l)); right:calc(10px + var(--safe-r));
    display:flex; align-items:flex-end; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .caption-panel{
    background:var(--ui-bg); border:1px solid rgba(255,255,255,.18); border-radius:12px;
    padding:8px 12px; max-width:min(360px,60vw); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .caption-panel summary{ cursor:pointer; font-size:13px; font-weight:600; list-style:none; display:flex; align-items:center; gap:6px; }
  .caption-panel summary::-webkit-details-marker{ display:none; }
  .caption-panel summary::before{ content:"▸"; transition:transform .2s ease; display:inline-block; }
  .caption-panel[open] summary::before{ transform:rotate(90deg); }
  .caption-panel p{ margin:8px 0 2px; font-size:12.5px; line-height:1.5; color:#dfe3ea; }

  .control-cluster{
    display:flex; align-items:center; gap:8px; background:var(--ui-bg);
    border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:8px 12px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); flex-wrap:wrap;
  }
  .clock{ font-variant-numeric: tabular-nums; font-size:13px; min-width:52px; text-align:center; }
  input[type="range"]{
    -webkit-appearance:none; appearance:none; width:80px; height:4px; border-radius:2px;
    background:rgba(255,255,255,.25); outline-offset:4px;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:var(--ui-accent); cursor:pointer; border:none;
  }
  input[type="range"]::-moz-range-thumb{
    width:14px; height:14px; border-radius:50%; background:var(--ui-accent); cursor:pointer; border:none;
  }
  .motion-btn{ display:none; }
  .motion-btn.show{ display:flex; }

  @media (max-width: 640px){
    .control-cluster{ padding:6px 10px; gap:6px; }
    input[type="range"]{ width:56px; }
    .ui-btn{ padding:7px 10px; font-size:12px; }
    .caption-panel{ max-width:80vw; }
  }

  @media (prefers-reduced-motion: reduce){
    .glass-reflection{ animation:none; }
    .drop{ animation-duration: 3s !important; }
    #landing, #experience, .city-card, .rain-layer{ transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

<!-- ================= Landing ================= -->
<main id="landing">
  <div class="landing-header">
    <h1>City Windows</h1>
    <p>Here are my favorite places in the world. Get a hint of what they feel like.</p>
  </div>
  <div class="city-strip" id="citySelector" role="list"></div>
</main>

<!-- ================= Window experience ================= -->
<section id="experience" aria-label="Window view experience">
  <div id="window-rig" role="img" aria-label="">
    <canvas id="sceneA" class="scene-canvas" aria-hidden="true"></canvas>
    <canvas id="sceneB" class="scene-canvas" aria-hidden="true"></canvas>
    <div class="glass-fx" aria-hidden="true">
      <div class="glass-reflection"></div>
      <div class="glass-grime"></div>
      <div class="rain-layer" id="rainLayer"></div>
    </div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="frame" aria-hidden="true">
      <div class="bar top"></div>
      <div class="bar left"></div>
      <div class="bar right"></div>
      <div class="bar sill"></div>
      <div class="mullion-v v1"></div>
      <div class="mullion-v v2"></div>
      <div class="mullion-h"></div>
    </div>
  </div>

  <div class="ui-layer">
    <div class="ui-top">
      <div class="back-group">
        <button class="ui-btn" id="backBtn" aria-label="Back to city selection">&larr; Back</button>
        <span class="city-title" id="cityTitle" aria-live="polite"></span>
      </div>
      <div class="city-switcher" id="citySwitcher" role="group" aria-label="Switch city"></div>
    </div>

    <div class="ui-bottom">
      <details class="caption-panel" id="captionPanel">
        <summary>Soundscape</summary>
        <p id="soundscapeDesc"></p>
      </details>

      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end;">
        <button class="ui-btn motion-btn" id="motionBtn">Enable motion tilt</button>
        <div class="control-cluster">
          <button class="ui-btn" id="dayNightBtn" style="padding:6px 10px;" aria-label="Toggle day/night mode">Auto</button>
          <button class="ui-btn" id="rainBtn" style="padding:6px 10px;" aria-pressed="false" aria-label="Toggle light rain">&#127783;</button>
          <span class="clock" id="clockDisplay" aria-label="Local time in this city">--:--</span>
        </div>
        <div class="control-cluster">
          <button class="ui-btn" id="muteBtn" style="padding:6px 10px;" aria-pressed="false" aria-label="Mute sound">&#128266;</button>
          <input type="range" id="volumeSlider" min="0" max="100" value="70" aria-label="Volume">
        </div>
      </div>
    </div>
  </div>
</section>

<div id="liveRegion" class="sr-only" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ============================================================
   Utilities
   ============================================================ */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v,a,b)=> Math.max(a, Math.min(b,v));
const lerp = (a,b,t)=> a + (b-a)*t;
const smoothstep = (e0,e1,x)=>{ const t = clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); };
function lerpColor(c1,c2,t){
  return [
    Math.round(lerp(c1[0],c2[0],t)),
    Math.round(lerp(c1[1],c2[1],t)),
    Math.round(lerp(c1[2],c2[2],t))
  ];
}
const rgb = (c)=> `rgb(${c[0]},${c[1]},${c[2]})`;
const rgba = (c,a)=> `rgba(${c[0]},${c[1]},${c[2]},${a})`;

const reducedMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============================================================
   City configuration
   ============================================================ */
const CITIES = [
  {
    id:'sydney', name:'Sydney', short:'Harbour lights & sea air', tz:'Australia/Sydney', seed:11,
    palette:{
      dayTop:[110,178,224], dayMid:[176,214,232], dayBottom:[224,238,232],
      nightTop:[8,12,32], nightMid:[18,26,52], nightBottom:[30,38,58],
      sun:[255,244,196], moon:[214,222,236]
    },
    description:"Harbour water lapping against the sandstone, distant gulls wheeling overhead, a ferry horn sounding across the bay, and a light salt breeze.",
    audio:{
      continuous:[
        {filterType:'bandpass', freq:480, q:1.1, gain:0.22, ampLfoRate:0.18, ampLfoDepth:0.45},
        {filterType:'highpass', freq:2400, q:0.6, gain:0.06}
      ],
      events:[
        {fn:'gull', interval:[2400,6500], gain:0.30},
        {fn:'ferryHorn', interval:[24000,50000], gain:0.22},
        {fn:'distantChatter', interval:[10000,22000], gain:0.07}
      ]
    }
  },
  {
    id:'dubai', name:'Dubai', short:'Desert heat & glass towers', tz:'Asia/Dubai', seed:22,
    palette:{
      dayTop:[74,156,224], dayMid:[210,198,164], dayBottom:[250,226,174],
      nightTop:[8,10,28], nightMid:[26,18,36], nightBottom:[58,36,32],
      sun:[255,226,150], moon:[224,220,232]
    },
    description:"Low desert wind, a distant highway hum, faint far-off construction, and every so often a call to prayer drifting softly across the skyline.",
    audio:{
      continuous:[
        {filterType:'lowpass', freq:380, q:0.5, gain:0.15},
        {filterType:'bandpass', freq:200, q:0.9, gain:0.12}
      ],
      events:[
        {fn:'constructionDistant', interval:[16000,32000], gain:0.09},
        {fn:'callToPrayer', interval:[65000,125000], gain:0.14},
        {fn:'planeFlyover', interval:[45000,90000], gain:0.09}
      ]
    }
  },
  {
    id:'dc', name:'Washington D.C.', short:'Monuments & motorcades', tz:'America/New_York', seed:33,
    palette:{
      dayTop:[104,158,214], dayMid:[186,206,222], dayBottom:[222,228,220],
      nightTop:[9,12,26], nightMid:[20,24,40], nightBottom:[28,30,40],
      sun:[255,241,205], moon:[210,218,232]
    },
    description:"Steady traffic below, sirens far off in the distance, birdsong in the trees, and the occasional pass of a helicopter overhead.",
    audio:{
      continuous:[
        {filterType:'bandpass', freq:260, q:1.0, gain:0.20},
        {filterType:'lowpass', freq:140, q:0.5, gain:0.09}
      ],
      events:[
        {fn:'siren', interval:[14000,30000], gain:0.13},
        {fn:'bird', interval:[3000,8000], gain:0.16},
        {fn:'helicopter', interval:[35000,70000], gain:0.18}
      ]
    }
  },
  {
    id:'philly', name:'Philadelphia', short:'Rowhouses & rail rumble', tz:'America/New_York', seed:44,
    palette:{
      dayTop:[118,150,196], dayMid:[190,196,206], dayBottom:[222,214,208],
      nightTop:[12,10,24], nightMid:[26,22,38], nightBottom:[38,30,36],
      sun:[255,234,190], moon:[216,214,228]
    },
    description:"A steady urban hum, the rumble of a passing train, murmurs of street chatter below, and church bells tolling in the distance.",

/* ============================================================
   Per-city scene state + bespoke composition drawing
   Each city gets its own hand-built scene (not a generic template)
   so the skyline, ground plane and moving elements are distinct.
   ============================================================ */
function makeClouds(rng, w, h, count, yMin, yMax){
  const clouds = [];
  for(let i=0;i<count;i++){
    clouds.push({
      x: rng()*w, y: h*(yMin+rng()*(yMax-yMin)),
      w: w*(0.12+rng()*0.14), h: h*(0.02+rng()*0.03),
      speed: 3+rng()*5, alpha: 0.3+rng()*0.3
    });
  }
  return clouds;
}

function perspectivePoint(t, laneOffsetNear, laneOffsetFar, w, h, horizonY, offsetX){
  const vx = w*0.5 + offsetX*0.5;
  return {
    x: vx + lerp(laneOffsetFar, laneOffsetNear, t),
    y: lerp(horizonY+4, h-8, t),
    scale: lerp(0.1, 1, t)
  };
}

/* ---------------- Sydney: harbour, Opera House, Harbour Bridge ---------------- */
function buildSydneyState(rng, w, h){
  const waterTop = h*0.7;
  const boats = [];
  for(let i=0;i<3;i++){
    boats.push({
      laneY: waterTop + h*(0.05+i*0.05) + rng()*h*0.02,
      x: rng()*w,
      speed: (7+rng()*9) * (rng()<0.5?1:-1),
      scale: 0.55 + i*0.28,
      bob: rng()*Math.PI*2
    });
  }
  return {
    waterTop, boats,
    clouds: makeClouds(rng, w, h, 4, 0.05, 0.26),
    birds: [], nextBirdAt: performance.now()+1500+rng()*4000
  };
}
function drawHazySkyline(ctx, w, groundY, offsetX, dayFactor){
  const rng = mulberry32(777);
  ctx.fillStyle = dayFactor>0.4 ? 'rgba(140,155,175,0.45)' : 'rgba(18,22,32,0.55)';
  let x = w*0.55 + offsetX;
  for(let i=0;i<9;i++){
    const bw = 14+rng()*20, bh = 30+rng()*70;
    ctx.fillRect(x, groundY-bh, bw, bh);
    x += bw+rng()*4;
  }
}
function drawHarbourBridge(ctx, cx, groundY, scaleBase, dayFactor){
  const s = scaleBase/900;
  const spanW = 460*s;
  const deckY = groundY - 40*s;
  const outerRise = 132*s, innerRise = 98*s;
  const color = dayFactor>0.45 ? 'rgba(32,36,46,0.92)' : 'rgba(5,7,13,0.96)';
  const N = 36;
  const outer = [], inner = [];
  for(let i=0;i<=N;i++){
    const t = i/N;
    const x = cx - spanW/2 + t*spanW;
    // quadratic-bezier rise formula: y(t) = base - 4*rise*t*(1-t)
    outer.push([x, deckY - 4*outerRise*t*(1-t)]);
    inner.push([x, deckY - 4*innerRise*t*(1-t)]);
  }
  // filled truss box: trace the outer curve forward, inner curve backward
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(outer[0][0], outer[0][1]);
  outer.forEach(p=> ctx.lineTo(p[0],p[1]));
  for(let i=inner.length-1;i>=0;i--) ctx.lineTo(inner[i][0], inner[i][1]);
  ctx.closePath();
  ctx.fill();
  // X-braced truss lattice inside the box
  ctx.strokeStyle = dayFactor>0.45 ? 'rgba(72,78,92,0.85)' : 'rgba(18,20,28,0.9)';
  ctx.lineWidth = Math.max(0.8,1.3*s);
  for(let i=0;i<N;i+=2){
    ctx.beginPath(); ctx.moveTo(outer[i][0],outer[i][1]); ctx.lineTo(inner[i+1][0],inner[i+1][1]); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(inner[i][0],inner[i][1]); ctx.lineTo(outer[i+1][0],outer[i+1][1]); ctx.stroke();
  }
  // hangers from the arch underside down to the deck
  ctx.lineWidth = Math.max(0.7,1.1*s);
  for(let i=4;i<N-3;i+=3){
    const p = inner[i];
    ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(p[0],deckY); ctx.stroke();
  }
  // deck
  ctx.fillStyle = color;
  ctx.fillRect(cx-spanW/2-8*s, deckY-5*s, spanW+16*s, 9*s);
  // granite pylons at both ends
  [-1,1].forEach(side=>{
    const pw = 30*s, ph = 112*s;
    const px = cx + side*(spanW/2 + pw/2 + 3*s);
    ctx.fillStyle = color;
    ctx.fillRect(px-pw/2, deckY-16*s, pw, ph);
    ctx.strokeStyle = dayFactor>0.45 ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.05)';
    ctx.lineWidth = Math.max(0.6,1*s);
    for(let f=1;f<4;f++){
      const fx = px-pw/2+pw*f/4;
      ctx.beginPath(); ctx.moveTo(fx,deckY-10*s); ctx.lineTo(fx,deckY-16*s+ph*0.8); ctx.stroke();
    }
  });
}
function drawOperaHouse(ctx, cx, groundY, scaleBase, dayFactor){
  const s = scaleBase/900;
  const baseColor = dayFactor>0.4 ? '#f4f5ef' : 'rgba(26,30,40,0.92)';
  const shadeColor = dayFactor>0.4 ? '#b7bbae' : 'rgba(10,12,17,0.9)';
  ctx.fillStyle = dayFactor>0.4 ? '#cdbfa4' : 'rgba(16,18,24,0.85)';
  ctx.fillRect(cx-155*s, groundY-16*s, 310*s, 16*s);
  // two shell clusters (main concert hall group + smaller side group),
  // each shell a pointed sail with fan-ridge shingle lines radiating
  // from near its base up to the curved edge.
  const groups = [
    [ {dx:-125,w:62,h:66,tilt:-0.18}, {dx:-76,w:74,h:92,tilt:-0.08},
      {dx:-14,w:82,h:114,tilt:0.0}, {dx:50,w:70,h:96,tilt:0.09} ],
    [ {dx:122,w:48,h:54,tilt:0.15}, {dx:162,w:36,h:42,tilt:0.24} ]
  ];
  groups.forEach(group=>{
    group.forEach(sh=>{
      const x = cx+sh.dx*s, w = sh.w*s, h = sh.h*s;
      ctx.save();
      ctx.translate(x, groundY-16*s);
      ctx.rotate(sh.tilt);
      ctx.fillStyle = baseColor;
      ctx.beginPath();
      ctx.moveTo(-w*0.5, 0);
      ctx.bezierCurveTo(-w*0.48,-h*0.4, -w*0.2,-h*0.86, w*0.02,-h);
      ctx.bezierCurveTo(w*0.2,-h*0.82, w*0.4,-h*0.36, w*0.48, 0);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = shadeColor; ctx.lineWidth = Math.max(0.7,1*s);
      const ridges = 7;
      for(let k=1;k<ridges;k++){
        const t = k/ridges;
        const ex = lerp(-w*0.46, w*0.02, Math.pow(t,0.9));
        const ey = -h*Math.pow(t,0.92);
        ctx.beginPath();
        ctx.moveTo(-w*0.03, -h*0.02);
        ctx.quadraticCurveTo(ex*0.55, ey*0.6, ex, ey);
        ctx.stroke();
      }
      ctx.restore();
    });
  });
}
function drawHarbourWater(ctx, w, h, waterTop, dayFactor, time){
  const top = lerpColor([70,120,150],[130,180,196], dayFactor);
  const bot = lerpColor([20,40,60],[70,110,130], dayFactor);
  const g = ctx.createLinearGradient(0,waterTop,0,h);
  g.addColorStop(0, rgb(top)); g.addColorStop(1, rgb(bot));
  ctx.fillStyle = g; ctx.fillRect(0,waterTop,w,h-waterTop);
  ctx.strokeStyle = `rgba(255,255,255,${0.12+dayFactor*0.12})`;
  ctx.lineWidth = 1;
  for(let i=0;i<26;i++){
    const yy = waterTop + (h-waterTop) * ((i*53%97)/97);
    const xOff = Math.sin(time*0.6+i)*14;
    const lw = 18+((i*37)%40);
    ctx.beginPath();
    ctx.moveTo(((i*83)%w)+xOff, yy);
    ctx.lineTo(((i*83)%w)+xOff+lw, yy);
    ctx.stroke();
  }
}
function updateAndDrawBoats(ctx, boats, w, dayFactor, dt, paused, now){
  boats.forEach(b=>{
    if(!paused) b.x += b.speed*dt;
    if(b.speed>0 && b.x>w+60) b.x=-60;
    if(b.speed<0 && b.x<-60) b.x=w+60;
    const y = b.laneY + Math.sin(now*0.001+b.bob)*2;
    const s = b.scale, dir = b.speed>0?1:-1;
    ctx.save();
    ctx.translate(b.x,y);
    ctx.scale(dir,1);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.moveTo(-14*s,0); ctx.lineTo(-40*s,6*s); ctx.lineTo(-40*s,-6*s); ctx.closePath(); ctx.fill();
    ctx.fillStyle = dayFactor>0.4 ? '#f2f2ee' : 'rgba(28,30,36,0.9)';
    ctx.beginPath(); ctx.moveTo(-14*s,4*s); ctx.lineTo(12*s,4*s); ctx.lineTo(16*s,0); ctx.lineTo(-16*s,0); ctx.closePath(); ctx.fill();
    ctx.fillRect(-6*s,-6*s,14*s,6*s);
    ctx.restore();
    if(dayFactor<0.35){
      ctx.fillStyle = 'rgba(255,210,140,0.9)';
      ctx.beginPath(); ctx.arc(b.x+6*s*dir, y-3*s, 1.6*s, 0, Math.PI*2); ctx.fill();
    }
  });
}
function renderSydney(ctx, w, h, state, now, dt, opts, city){
  drawSunMoon(ctx, w, h, city.palette, state.dayFactor, (state.time*0.004)%1);
  drawClouds(ctx, state.clouds, w, h, state.parallaxX, state.dayFactor, dt, opts.reduced);
  const px = state.parallaxX;
  drawHazySkyline(ctx, w, state.waterTop, px*8, state.dayFactor);
  drawHarbourBridge(ctx, w*0.32+px*18, state.waterTop, Math.min(w,h), state.dayFactor);
  drawOperaHouse(ctx, w*0.7+px*30, state.waterTop, Math.min(w,h), state.dayFactor);
  drawHarbourWater(ctx, w, h, state.waterTop, state.dayFactor, state.time);
  updateAndDrawBoats(ctx, state.boats, w, state.dayFactor, dt, opts.reduced, now);
  drawBirds(state, ctx, w, h, now, state.dayFactor, opts.reduced);
}

/* ---------------- Dubai: Sheikh Zayed Road, glass towers, traffic ---------------- */
const DUBAI_TOP_TYPES = ['flat','point','step','dome','antenna','twist'];
function makeDubaiTowers(rng, side){
  const towers = [];
  const count = 11;
  for(let i=0;i<count;i++){
    towers.push({
      depth: i/(count-1), side,
      baseW: 40+rng()*58, baseH: 170+rng()*300,
      hue: rng(),
      colorFamily: rng(),
      topType: DUBAI_TOP_TYPES[Math.floor(rng()*DUBAI_TOP_TYPES.length)]
    });
  }
  return towers;
}
function buildDubaiState(rng, w, h){
  const horizonY = h*0.58;
  const cars = [];
  for(let i=0;i<7;i++){
    cars.push({ lane:i%3, t:rng(), speed:0.5+rng()*0.4, dir: rng()<0.5?1:-1, hue:rng() });
  }
  return {
    horizonY,
    towersLeft: makeDubaiTowers(rng,'left'),
    towersRight: makeDubaiTowers(rng,'right'),
    cars,
    clouds: makeClouds(rng, w, h, 3, 0.04, 0.2)
  };
}
function dubaiTowerTone(t, dayFactor){
  let hueBase, sat;
  if(t.colorFamily<0.4){ hueBase=204; sat=30+t.hue*18; }       // cool blue glass
  else if(t.colorFamily<0.68){ hueBase=38; sat=32+t.hue*20; }   // warm gold glass
  else { hueBase=210; sat=5+t.hue*8; }                          // silver/white
  const light = dayFactor>0.4 ? 52+t.hue*20 : 7+t.hue*7;
  return `hsl(${hueBase+t.hue*12},${sat}%,${light}%)`;
}
function drawDubaiTower(ctx, t, w, h, horizonY, dayFactor, offsetX){
  const vx = w*0.5+offsetX*0.5;
  const edgeX = t.side==='left' ? -20 : w+20;
  const x = lerp(edgeX, vx, Math.pow(t.depth,0.9)) + offsetX*(1-t.depth)*0.3;
  const scale = lerp(1, 0.08, t.depth);
  const bw = t.baseW*scale, bh = t.baseH*scale;
  const baseY = lerp(h*0.98, horizonY, t.depth);
  const topY = baseY-bh;
  const x0 = t.side==='left' ? x : x-bw;
  const tone = dubaiTowerTone(t, dayFactor);
  ctx.fillStyle = tone;

  if(t.topType==='point'){
    const capH = bh*0.2;
    ctx.fillRect(x0, topY+capH, bw, bh-capH);
    ctx.beginPath();
    ctx.moveTo(x0,topY+capH); ctx.lineTo(x0+bw/2,topY); ctx.lineTo(x0+bw,topY+capH);
    ctx.closePath(); ctx.fill();
  } else if(t.topType==='step'){
    const tiers = 4, tierH = bh/tiers;
    for(let tier=0; tier<tiers; tier++){
      const tw = bw*(1-tier*0.15);
      const tx0 = x0+(bw-tw)/2;
      ctx.fillRect(tx0, topY+tier*tierH, tw, tierH+1);
    }
  } else if(t.topType==='dome'){
    const domeR = bw/2;
    ctx.fillRect(x0, topY+domeR, bw, bh-domeR);
    ctx.beginPath(); ctx.arc(x0+bw/2, topY+domeR, domeR, Math.PI, 0); ctx.fill();
  } else if(t.topType==='twist'){
    const bands = 9;
    for(let bnd=0; bnd<bands; bnd++){
      const bandH = bh/bands;
      const tw = bw*0.8;
      const twist = Math.sin((bnd/bands)*Math.PI*0.5) * bw*0.32 * (bnd/bands);
      ctx.fillRect(x0+twist, topY+bnd*bandH, tw, bandH+1);
    }
  } else if(t.topType==='antenna'){
    ctx.fillRect(x0, topY, bw, bh);
    ctx.strokeStyle = tone; ctx.lineWidth = Math.max(0.8,1.5*scale);
    ctx.beginPath(); ctx.moveTo(x0+bw/2,topY); ctx.lineTo(x0+bw/2,topY-36*scale); ctx.stroke();
  } else {
    ctx.fillRect(x0, topY, bw, bh);
  }

  ctx.strokeStyle = dayFactor>0.4 ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.07)';
  ctx.lineWidth = Math.max(0.4,0.8*scale);
  const seams = Math.max(2, Math.round(bw/(9*scale+6)));
  for(let sN=1;sN<seams;sN++){
    const sx = x0 + (bw*sN/seams);
    ctx.beginPath(); ctx.moveTo(sx, topY); ctx.lineTo(sx, baseY); ctx.stroke();
  }
  if(dayFactor<0.5){
    const alphaBase = (0.5-dayFactor)*2;
    const rows = Math.max(2, Math.floor(bh/(13*scale+1)));
    const cols = Math.max(1, Math.floor(bw/(9*scale+1)));
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      if(((r*31+c*17+Math.floor(t.hue*97))%5)===0){
        ctx.fillStyle = `rgba(255,214,140,${0.5*alphaBase})`;
        ctx.fillRect(x0+2+c*(bw/cols), topY+2+r*(bh/rows), Math.max(1,3*scale), Math.max(1,4*scale));
      }
    }
  }
}
function drawBurjKhalifa(ctx, cx, groundY, scaleBase, dayFactor){
  const s = scaleBase/900;
  const tone = dayFactor>0.4 ? 'hsl(200,18%,74%)' : 'hsl(200,10%,14%)';
  ctx.fillStyle = tone;
  const tiers = [ [0,150,46], [0,230,36], [0,300,26], [0,360,16], [0,410,7] ];
  tiers.forEach(([dx,hgt,w])=>{
    ctx.fillRect(cx+dx*s-w*s/2, groundY-hgt*s, w*s, hgt*s);
  });
  ctx.strokeStyle = tone; ctx.lineWidth = Math.max(1,2*s);
  ctx.beginPath(); ctx.moveTo(cx,groundY-410*s); ctx.lineTo(cx,groundY-475*s); ctx.stroke();
  ctx.strokeStyle = dayFactor>0.4 ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.1)';
  ctx.lineWidth = Math.max(0.5,1*s);
  [150,230,300,360].forEach(hgt=>{
    ctx.beginPath(); ctx.moveTo(cx-4*s,groundY-hgt*s); ctx.lineTo(cx-4*s,groundY-4*s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+4*s,groundY-hgt*s); ctx.lineTo(cx+4*s,groundY-4*s); ctx.stroke();
  });
  if(dayFactor<0.5){
    const rng = mulberry32(42);
    const alphaBase = (0.5-dayFactor)*2;
    for(let i=0;i<70;i++){
      const tier = tiers[Math.floor(rng()*tiers.length)];
      const yy = groundY - rng()*tier[1]*s;
      const xx = cx + (rng()-0.5)*tier[2]*s*0.8;
      ctx.fillStyle = `rgba(255,214,140,${0.55*alphaBase})`;
      ctx.fillRect(xx,yy,Math.max(1,2*s),Math.max(1,3*s));
    }
  }
}
function drawDubaiRoad(ctx, w, h, horizonY, offsetX, time){
  const vx = w*0.5+offsetX*0.5;
  ctx.fillStyle = '#33363c';
  ctx.beginPath();
  ctx.moveTo(vx-14,horizonY); ctx.lineTo(vx+14,horizonY);
  ctx.lineTo(w*0.88,h); ctx.lineTo(w*0.12,h);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  const dashCount = 14;
  for(let i=0;i<dashCount;i++){
    const t = ((i/dashCount) + (time*0.05)%1) % 1;
    const y = lerp(horizonY,h,t);
    const dashW = lerp(1,7,t), dashH = lerp(2,22,t);
    ctx.fillRect(vx-dashW/2, y, dashW, dashH);
  }
}
function updateAndDrawDubaiCars(ctx, cars, w, h, horizonY, offsetX, dayFactor, dt, paused){
  cars.sort((a,b)=>b.t-a.t);
  cars.forEach(c=>{
    if(!paused){
      c.t += c.speed*dt*c.dir*0.35;
      if(c.t>1.05) c.t=-0.05;
      if(c.t<-0.05) c.t=1.05;
    }
    const t = clamp(c.t,0,1);
    const pt = perspectivePoint(t, (c.lane-1)*34, (c.lane-1)*3, w, h, horizonY, offsetX);
    const cw = 26*pt.scale, ch = 12*pt.scale;
    ctx.fillStyle = dayFactor>0.4 ? ['#c0392b','#2c3e50','#ecf0f1','#7f8c8d'][Math.floor(c.hue*4)] : '#141414';
    ctx.fillRect(pt.x-cw/2, pt.y-ch, cw, ch);
    if(dayFactor<=0.4){
      ctx.fillStyle = c.dir>0 ? 'rgba(255,255,255,0.95)' : 'rgba(255,70,60,0.95)';
      ctx.beginPath();
      ctx.arc(pt.x-cw*0.3, pt.y-ch*0.3, 1.6*pt.scale, 0, Math.PI*2);
      ctx.arc(pt.x+cw*0.3, pt.y-ch*0.3, 1.6*pt.scale, 0, Math.PI*2);
      ctx.fill();
    }
  });
}
function renderDubai(ctx, w, h, state, now, dt, opts, city){
  drawSunMoon(ctx, w, h, city.palette, state.dayFactor, (state.time*0.004)%1);
  drawClouds(ctx, state.clouds, w, h, state.parallaxX, state.dayFactor, dt, opts.reduced);
  drawBurjKhalifa(ctx, w*0.5+state.parallaxX*4, state.horizonY, Math.min(w,h), state.dayFactor);
  drawDubaiRoad(ctx, w, h, state.horizonY, state.parallaxX, state.time);
  const towers = [...state.towersLeft, ...state.towersRight].sort((a,b)=>b.depth-a.depth);
  towers.forEach(t=> drawDubaiTower(ctx, t, w, h, state.horizonY, state.dayFactor, state.parallaxX));
  updateAndDrawDubaiCars(ctx, state.cars, w, h, state.horizonY, state.parallaxX, state.dayFactor, dt, opts.reduced);
}

/* ---------------- Washington D.C.: Tidal Basin cherry blossoms ---------------- */
function buildDCState(rng, w, h){
  const waterTop = h*0.72;
  const branches = ['tl','tr'].map(side=>{
    const count = 5+Math.floor(rng()*3);
    const blossoms = [];
    for(let i=0;i<count;i++){
      blossoms.push({ dx: 20+rng()*130, dy: 10+rng()*100, r: 14+rng()*18, hue: rng() });
    }
    return { side, blossoms, swayPhase: rng()*Math.PI*2, swaySpeed: 0.35+rng()*0.25 };
  });
  return {
    waterTop, branches, petals: [], nextPetalAt: performance.now()+2000,
    clouds: makeClouds(rng, w, h, 3, 0.05, 0.18),
    birds: [], nextBirdAt: performance.now()+2000+rng()*4000
  };
}
function drawWashingtonMonument(ctx, cx, groundY, scaleBase, dayFactor){
  const s = scaleBase/900;
  const ow = 22*s, oh = 280*s;
  ctx.fillStyle = dayFactor>0.3 ? '#e8e4da' : 'rgba(58,56,52,0.9)';
  ctx.beginPath();
  ctx.moveTo(cx-ow/2,groundY);
  ctx.lineTo(cx-ow/2,groundY-oh);
  ctx.lineTo(cx,groundY-oh-30*s);
  ctx.lineTo(cx+ow/2,groundY-oh);
  ctx.lineTo(cx+ow/2,groundY);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 1*s;
  ctx.beginPath(); ctx.moveTo(cx,groundY); ctx.lineTo(cx,groundY-oh-30*s); ctx.stroke();
}
function drawFarTreeline(ctx, w, groundY, dayFactor){
  const rng = mulberry32(555);
  ctx.fillStyle = dayFactor>0.3 ? 'rgba(210,170,190,0.5)' : 'rgba(28,24,32,0.6)';
  let x = 0;
  while(x<w){
    const rw = 30+rng()*40;
    ctx.beginPath(); ctx.ellipse(x+rw/2, groundY-14, rw*0.6, 16, 0,0,Math.PI*2); ctx.fill();
    x += rw*0.8;
  }
}
function drawTidalBasin(ctx, w, h, waterTop, dayFactor, time){
  const top = lerpColor([60,90,120],[150,188,206], dayFactor);
  const bot = lerpColor([20,30,46],[195,208,212], dayFactor);
  const g = ctx.createLinearGradient(0,waterTop,0,h);
  g.addColorStop(0, rgb(top)); g.addColorStop(1, rgb(bot));
  ctx.fillStyle = g; ctx.fillRect(0,waterTop,w,h-waterTop);
  ctx.strokeStyle = `rgba(255,255,255,${0.08+dayFactor*0.1})`;
  for(let i=0;i<18;i++){
    const yy = waterTop+(h-waterTop)*(i/18);
    const xOff = Math.sin(time*0.4+i)*10;
    ctx.beginPath(); ctx.moveTo(((i*97)%w)+xOff,yy); ctx.lineTo(((i*97)%w)+xOff+30,yy); ctx.stroke();
  }
}
function drawCherryBlossoms(ctx, w, h, branches, time, reduced){
  branches.forEach(branch=>{
    const sway = reduced ? 0 : Math.sin(time*branch.swaySpeed+branch.swayPhase)*0.07;
    const isLeft = branch.side==='tl';
    const originX = isLeft ? -10 : w+10, originY = -10;
    const dirX = isLeft ? 1 : -1, dirY = 1;
    ctx.save();
    ctx.translate(originX, originY);
    ctx.rotate(sway);
    ctx.strokeStyle = 'rgba(60,42,36,0.9)';
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(dirX*160,dirY*120); ctx.stroke();
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(dirX*70,dirY*40); ctx.lineTo(dirX*130,dirY*90); ctx.stroke();
    branch.blossoms.forEach(b=>{
      const bx = dirX*b.dx, by = dirY*b.dy;
      const pink = lerpColor([255,214,225],[255,180,205], b.hue);
      ctx.fillStyle = rgba(pink,0.92);
      [[0,0],[b.r*0.5,b.r*0.15],[-b.r*0.3,b.r*0.4]].forEach(([ox,oy])=>{
        ctx.beginPath(); ctx.arc(bx+ox,by+oy,b.r*0.5,0,Math.PI*2); ctx.fill();
      });
    });
    ctx.restore();
  });
}
function updateAndDrawPetals(state, ctx, w, h, dt, reduced){
  if(!reduced && performance.now()>state.nextPetalAt && state.petals.length<14){
    state.petals.push({ x:Math.random()*w, y:-10, vy:14+Math.random()*10, vx:(Math.random()-0.5)*10, phase:Math.random()*Math.PI*2 });
    state.nextPetalAt = performance.now()+900+Math.random()*1600;
  }
  ctx.fillStyle = 'rgba(255,200,215,0.85)';
  for(let i=state.petals.length-1;i>=0;i--){
    const p = state.petals[i];
    if(!reduced){ p.y += p.vy*dt; p.x += p.vx*dt + Math.sin(p.y*0.05+p.phase)*0.4; }
    ctx.beginPath(); ctx.arc(p.x,p.y,2.4,0,Math.PI*2); ctx.fill();
    if(p.y>h+10) state.petals.splice(i,1);
  }
}
function renderDC(ctx, w, h, state, now, dt, opts, city){
  drawSunMoon(ctx, w, h, city.palette, state.dayFactor, (state.time*0.004)%1);
  drawClouds(ctx, state.clouds, w, h, state.parallaxX, state.dayFactor, dt, opts.reduced);
  drawFarTreeline(ctx, w, state.waterTop, state.dayFactor);
  drawWashingtonMonument(ctx, w*0.5+state.parallaxX*10, state.waterTop, Math.min(w,h), state.dayFactor);
  drawTidalBasin(ctx, w, h, state.waterTop, state.dayFactor, state.time);
  drawBirds(state, ctx, w, h, now, state.dayFactor, opts.reduced);
  drawCherryBlossoms(ctx, w, h, state.branches, state.time, opts.reduced);
  updateAndDrawPetals(state, ctx, w, h, dt, opts.reduced);
}

/* ---------------- Philadelphia: rowhomes, trees, fairy lights ---------------- */
function genRowhomeWindows(rng, width, height){
  const wins = [];
  const cols = Math.max(1, Math.floor(width/26));
  const rows = Math.max(2, Math.floor(height/34));
  for(let r=0;r<rows-1;r++) for(let c=0;c<cols;c++){
    wins.push({ cx:(c+0.5)/cols, cy:(r+0.6)/rows, lit: rng()<0.5, phase: rng()*Math.PI*2 });
  }
  return wins;
}
function genRowhomes(rng, w, groundY){
  const homes = [];
  const brickHues = [['#8a3b2e','#6e2c22'],['#7c3d2a','#5e2c1e'],['#9c4a34','#7a3626'],['#6f3324','#54241a']];
  let x = -20;
  while(x<w+20){
    const width = 60+rng()*30, height = 90+rng()*50;
    homes.push({
      x, width, height,
      brick: brickHues[Math.floor(rng()*brickHues.length)],
      doorHue: rng(),
      windows: genRowhomeWindows(rng,width,height)
    });
    x += width;
  }
  return homes;
}
function buildPhillyState(rng, w, h){
  const groundY = h*0.86;
  const lights = [];
  for(let sN=0;sN<3;sN++){
    const y0 = h*(0.26+sN*0.11), sag = 18+rng()*18;
    const count = 8+Math.floor(rng()*4);
    const pts = [];
    for(let i=0;i<count;i++) pts.push({ t:i/(count-1), phase: rng()*Math.PI*2, hue: rng() });
    lights.push({ y0, sag, pts, xStart: w*0.03, xEnd: w*0.97 });
  }
  return {
    groundY,
    rowhomes: genRowhomes(rng, w, groundY),
    lights, leaves: [], nextLeafAt: performance.now()+1500,
    clouds: makeClouds(rng, w, h, 3, 0.04, 0.16)
  };
}
function drawRowhomes(ctx, homes, groundY, offsetX, dayFactor){
  homes.forEach(hm=>{
    const x = hm.x+offsetX;
    ctx.fillStyle = dayFactor>0.35 ? hm.brick[0] : hm.brick[1];
    ctx.fillRect(x, groundY-hm.height, hm.width, hm.height);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(x, groundY-hm.height, hm.width, 4);
    const doorW = hm.width*0.22, doorH = hm.height*0.32;
    const doorColors = ['#2f6b52','#8a2f3a','#274a73','#a8672c'];
    ctx.fillStyle = doorColors[Math.floor(hm.doorHue*doorColors.length)];
    ctx.fillRect(x+hm.width*0.5-doorW/2, groundY-doorH, doorW, doorH);
    ctx.fillStyle = 'rgba(120,110,100,0.9)';
    ctx.fillRect(x+hm.width*0.5-doorW*0.7, groundY, doorW*1.4, 6);
    const nightness = 1-dayFactor;
    hm.windows.forEach(win=>{
      const wx = x+win.cx*hm.width, wy = groundY-hm.height+win.cy*hm.height;
      const lit = win.lit && nightness>0.25;
      ctx.fillStyle = lit ? `rgba(255,205,140,${0.85*nightness})` : 'rgba(20,18,20,0.55)';
      ctx.fillRect(wx-5,wy-7,10,14);
      ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1; ctx.strokeRect(wx-5,wy-7,10,14);
    });
  });
}
function drawTreeCanopy(ctx, w, h, groundY, parallaxX, dayFactor, seed){
  const rng = mulberry32(seed);
  const leafColor = dayFactor>0.35 ? 'rgba(90,110,60,0.9)' : 'rgba(30,36,26,0.9)';
  const darkLeafColor = dayFactor>0.35 ? 'rgba(66,86,44,0.85)' : 'rgba(20,26,18,0.85)';
  for(let i=0;i<3;i++){
    const tx = w*(0.15+i*0.35) + parallaxX*20;
    const trunkH = h*0.26;
    const trunkTopY = groundY - trunkH;
    ctx.strokeStyle = 'rgba(45,32,26,0.95)'; ctx.lineWidth = 11;
    ctx.beginPath(); ctx.moveTo(tx,groundY); ctx.lineTo(tx-3,trunkTopY+14); ctx.stroke();
    ctx.strokeStyle = 'rgba(45,32,26,0.7)'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(tx-2,trunkTopY+50); ctx.lineTo(tx-26,trunkTopY+10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tx-1,trunkTopY+40); ctx.lineTo(tx+24,trunkTopY+6); ctx.stroke();
    // anchor blob sits directly over the trunk top so the canopy always
    // connects — the randomized blobs below only add fullness above it.
    ctx.fillStyle = leafColor;
    ctx.beginPath(); ctx.ellipse(tx, trunkTopY+12, 60, 46, 0, 0, Math.PI*2); ctx.fill();
    for(let b=0;b<7;b++){
      const bx = tx+(rng()-0.5)*140;
      const by = trunkTopY - rng()*85;
      ctx.fillStyle = rng()<0.4 ? darkLeafColor : leafColor;
      ctx.beginPath(); ctx.ellipse(bx,by,46+rng()*30,34+rng()*20,0,0,Math.PI*2); ctx.fill();
    }
  }
}
function drawFairyLights(ctx, w, h, lights, parallaxX, now, dayFactor){
  const glowStrength = clamp(1-dayFactor*1.4,0,1);
  lights.forEach(strand=>{
    ctx.strokeStyle = 'rgba(40,34,30,0.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for(let i=0;i<=20;i++){
      const t = i/20;
      const x = lerp(strand.xStart,strand.xEnd,t)+parallaxX*14;
      const y = strand.y0+Math.sin(t*Math.PI)*strand.sag;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
    strand.pts.forEach(p=>{
      const x = lerp(strand.xStart,strand.xEnd,p.t)+parallaxX*14;
      const y = strand.y0+Math.sin(p.t*Math.PI)*strand.sag;
      const twinkle = 0.55+Math.sin(now*0.003+p.phase)*0.35+(Math.sin(now*0.011+p.phase*3)>0.92?0.3:0);
      const alpha = clamp(twinkle,0,1)*(0.35+glowStrength*0.65);
      const hue = ['255,214,150','255,190,150','255,225,190'][Math.floor(p.hue*3)];
      if(glowStrength>0.3){
        const glow = ctx.createRadialGradient(x,y,0,x,y,7);
        glow.addColorStop(0,`rgba(${hue},${alpha*0.5})`); glow.addColorStop(1,`rgba(${hue},0)`);
        ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x,y,7,0,Math.PI*2); ctx.fill();
      }
      ctx.fillStyle = `rgba(${hue},${alpha})`;
      ctx.beginPath(); ctx.arc(x,y,2.4,0,Math.PI*2); ctx.fill();
    });
  });
}
function updateAndDrawLeaves(state, ctx, w, h, dt, reduced){
  if(!reduced && performance.now()>state.nextLeafAt && state.leaves.length<10){
    state.leaves.push({ x:Math.random()*w, y:-10, vy:10+Math.random()*8, vx:(Math.random()-0.5)*8, phase:Math.random()*Math.PI*2, hue:Math.random() });
    state.nextLeafAt = performance.now()+1200+Math.random()*2200;
  }
  for(let i=state.leaves.length-1;i>=0;i--){
    const lv = state.leaves[i];
    if(!reduced){ lv.y += lv.vy*dt; lv.x += Math.sin(lv.y*0.05+lv.phase)*0.6; }
    const c = lerpColor([200,140,50],[170,80,40],lv.hue);
    ctx.fillStyle = rgba(c,0.85);
    ctx.beginPath(); ctx.ellipse(lv.x,lv.y,3,2,lv.phase,0,Math.PI*2); ctx.fill();
    if(lv.y>h+10) state.leaves.splice(i,1);
  }
}
function renderPhilly(ctx, w, h, state, now, dt, opts, city){
  drawSunMoon(ctx, w, h, city.palette, state.dayFactor, (state.time*0.004)%1);
  drawClouds(ctx, state.clouds, w, h, state.parallaxX, state.dayFactor, dt, opts.reduced);
  drawRowhomes(ctx, state.rowhomes, state.groundY, state.parallaxX*10, state.dayFactor);
  drawTreeCanopy(ctx, w, h, state.groundY, state.parallaxX, state.dayFactor, city.seed);
  drawFairyLights(ctx, w, h, state.lights, state.parallaxX, now, state.dayFactor);
  updateAndDrawLeaves(state, ctx, w, h, dt, opts.reduced);
}

/* ---------------- Karachi: street canyon, moving rickshaws ---------------- */
function makeKarachiBuildings(rng, side){
  const list = [];
  const count = 9;
  for(let i=0;i<count;i++){
    list.push({
      depth: i/(count-1), side,
      baseW: 42+rng()*44, baseH: 100+rng()*190,
      hue: rng(), signage: rng()<0.4,
      balconies: rng()<0.6, waterTank: rng()<0.35,
      laundry: rng()<0.45
    });
  }
  return list;
}
function buildKarachiState(rng, w, h){
  const horizonY = h*0.56;
  const rickshaws = [];
  for(let i=0;i<3;i++){
    rickshaws.push({ lane:i%3, t:rng(), speed:0.4+rng()*0.35, dir: rng()<0.6?1:-1, hue:rng(), kind:'rickshaw' });
  }
  for(let i=0;i<3;i++){
    rickshaws.push({ lane:i%3, t:rng(), speed:0.5+rng()*0.4, dir: rng()<0.6?1:-1, hue:rng(), kind:'motorbike' });
  }
  const wires = [];
  for(let i=0;i<3;i++) wires.push({ y0: horizonY-10-i*14, sag: 12+rng()*10 });
  return {
    horizonY,
    buildingsLeft: makeKarachiBuildings(rng,'left'),
    buildingsRight: makeKarachiBuildings(rng,'right'),
    rickshaws, wires,
    clouds: makeClouds(rng, w, h, 3, 0.03, 0.14),
    birds: [], nextBirdAt: performance.now()+2500+rng()*4000
  };
}
function drawKarachiBuilding(ctx, b, w, h, horizonY, dayFactor, offsetX){
  const vx = w*0.5+offsetX*0.5;
  const edgeX = b.side==='left' ? -20 : w+20;
  const x = lerp(edgeX, vx, Math.pow(b.depth,0.85)) + offsetX*(1-b.depth)*0.25;
  const scale = lerp(1, 0.13, b.depth);
  const bw = b.baseW*scale, bh = b.baseH*scale;
  const baseY = lerp(h*0.96, horizonY, b.depth);
  const topY = baseY-bh;
  const x0 = b.side==='left' ? x : x-bw;
  const tone = dayFactor>0.35
    ? lerpColor([196,170,140],[220,196,160],b.hue)
    : lerpColor([9,8,9],[20,16,15],b.hue);
  ctx.fillStyle = rgb(tone);
  ctx.fillRect(x0, topY, bw, bh);
  const nightness = 1-dayFactor;
  const cols = Math.max(2, Math.floor(bw/(9*scale+4)));
  const rows = Math.max(2, Math.floor(bh/(11*scale+4)));
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const lit = nightness>0.25 && ((r*13+c*7+Math.floor(b.hue*97))%4===0);
    ctx.fillStyle = lit ? `rgba(255,205,140,${0.6*nightness})` : 'rgba(20,16,14,0.35)';
    ctx.fillRect(x0+2+c*(bw/cols), topY+2+r*(bh/rows), Math.max(1,4*scale), Math.max(1,5*scale));
  }
  if(b.balconies && scale>0.3){
    const bRows = Math.max(1,Math.floor(rows/2));
    ctx.fillStyle = dayFactor>0.35 ? 'rgba(140,120,100,0.7)' : 'rgba(6,6,8,0.7)';
    for(let r=1;r<bRows;r++){
      const by = topY + (r*2-0.5)*(bh/rows);
      ctx.fillRect(x0-2*scale, by, bw+4*scale, Math.max(1,2*scale));
      if(b.laundry && r%2===0){
        const colors=['#e8e0d0','#c0392b','#2980b9','#f1c40f'];
        for(let k=0;k<3;k++){
          ctx.fillStyle = colors[(k+Math.floor(b.hue*7))%colors.length];
          ctx.fillRect(x0+bw*0.2+k*bw*0.25, by+1*scale, Math.max(1,3*scale), Math.max(1,4*scale));
        }
      }
    }
  }
  if(b.waterTank && scale>0.35){
    ctx.fillStyle = dayFactor>0.35 ? 'rgba(90,80,60,0.9)' : 'rgba(4,4,5,0.9)';
    ctx.fillRect(x0+bw*0.62, topY-bh*0.06, bw*0.2, bh*0.06);
  }
  if(b.signage && scale>0.4){
    ctx.fillStyle = ['#c0392b','#2980b9','#27ae60','#e67e22'][Math.floor(b.hue*4)];
    ctx.fillRect(x0, baseY-bh*0.18, bw, bh*0.07);
  }
}
function drawKarachiStreet(ctx, w, h, horizonY, offsetX){
  const vx = w*0.5+offsetX*0.5;
  ctx.fillStyle = '#5b4d3c';
  ctx.beginPath();
  ctx.moveTo(vx-8,horizonY); ctx.lineTo(vx+8,horizonY);
  ctx.lineTo(w*0.66,h); ctx.lineTo(w*0.34,h);
  ctx.closePath(); ctx.fill();
}
function drawWires(ctx, w, wires, offsetX){
  ctx.strokeStyle = 'rgba(20,20,24,0.5)'; ctx.lineWidth = 1;
  wires.forEach(wire=>{
    ctx.beginPath();
    for(let i=0;i<=20;i++){
      const t = i/20;
      const x = t*w+offsetX*0.3;
      const y = wire.y0+Math.sin(t*Math.PI)*wire.sag;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  });
}
function updateAndDrawRickshaws(ctx, rickshaws, w, h, horizonY, offsetX, dayFactor, dt, paused){
  rickshaws.sort((a,b)=>b.t-a.t);
  rickshaws.forEach(r=>{
    if(!paused){
      r.t += r.speed*dt*r.dir*0.4;
      if(r.t>1.05) r.t=-0.05;
      if(r.t<-0.05) r.t=1.05;
    }
    const t = clamp(r.t,0,1);
    const pt = perspectivePoint(t, (r.lane-1)*30, (r.lane-1)*3, w, h, horizonY, offsetX);
    const s = pt.scale, dir = r.dir;
    ctx.save();
    ctx.translate(pt.x, pt.y);
    ctx.scale(dir,1);
    if(r.kind==='motorbike'){
      const bodyColor = ['#2c3e50','#7f2f2f','#3a3a3a'][Math.floor(r.hue*3)];
      ctx.strokeStyle = bodyColor; ctx.lineWidth = Math.max(1,2*s);
      ctx.beginPath(); ctx.moveTo(-7*s,-2*s); ctx.lineTo(4*s,-9*s); ctx.lineTo(7*s,-2*s); ctx.stroke();
      ctx.fillStyle = '#c9a877';
      ctx.beginPath(); ctx.arc(1*s,-13*s,3*s,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = bodyColor;
      ctx.fillRect(-3*s,-11*s,7*s,6*s);
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.arc(-7*s,0,2.6*s,0,Math.PI*2); ctx.arc(7*s,0,2.6*s,0,Math.PI*2); ctx.fill();
    } else {
      const bodyColor = ['#f1c40f','#2ecc71','#e67e22'][Math.floor(r.hue*3)];
      ctx.fillStyle = bodyColor;
      ctx.beginPath(); ctx.ellipse(0,-14*s,12*s,8*s,0,Math.PI,0); ctx.fill();
      ctx.fillRect(-10*s,-14*s,20*s,12*s);
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.arc(-7*s,0,3*s,0,Math.PI*2); ctx.arc(7*s,0,3*s,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
    if(dayFactor<=0.4){
      ctx.fillStyle = 'rgba(255,240,180,0.9)';
      ctx.beginPath(); ctx.arc(pt.x+8*s*dir, pt.y-6*s, 1.4*s, 0, Math.PI*2); ctx.fill();
    }
  });
}
function renderKarachi(ctx, w, h, state, now, dt, opts, city){
  drawSunMoon(ctx, w, h, city.palette, state.dayFactor, (state.time*0.004)%1);
  drawClouds(ctx, state.clouds, w, h, state.parallaxX, state.dayFactor, dt, opts.reduced);
  drawKarachiStreet(ctx, w, h, state.horizonY, state.parallaxX);
  const buildings = [...state.buildingsLeft, ...state.buildingsRight].sort((a,b)=>b.depth-a.depth);
  buildings.forEach(b=> drawKarachiBuilding(ctx, b, w, h, state.horizonY, state.dayFactor, state.parallaxX));
  drawWires(ctx, w, state.wires, state.parallaxX);
  updateAndDrawRickshaws(ctx, state.rickshaws, w, h, state.horizonY, state.parallaxX, state.dayFactor, dt, opts.reduced);
  drawBirds(state, ctx, w, h, now, state.dayFactor, opts.reduced);
}

const SCENES = {
  sydney: { build: buildSydneyState, render: renderSydney },
  dubai: { build: buildDubaiState, render: renderDubai },
  dc: { build: buildDCState, render: renderDC },
  philly: { build: buildPhillyState, render: renderPhilly },
  karachi: { build: buildKarachiState, render: renderKarachi }
};

function createSceneState(cityIndex, layerW, layerH){
  const city = CITIES[cityIndex];
  const rng = mulberry32(city.seed);
  const cityState = SCENES[city.id].build(rng, layerW, layerH);
  return Object.assign({
    cityIndex, rng,
    parallaxX: 0, parallaxY: 0,
    dayFactor: 0.5, dayFactorTarget: 0.5,
    layerW, layerH, time: 0
  }, cityState);
}

/* ============================================================
   Rendering
   ============================================================ */
function skyColorAt(palette, dayFactor, t){
  const top = lerpColor(palette.nightTop, palette.dayTop, dayFactor);
  const mid = lerpColor(palette.nightMid, palette.dayMid, dayFactor);
  const bot = lerpColor(palette.nightBottom, palette.dayBottom, dayFactor);
  return {top,mid,bot};
}

function drawSky(ctx, w, h, palette, dayFactor){
  const {top,mid,bot} = skyColorAt(palette, dayFactor);
  const g = ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0, rgb(top));
  g.addColorStop(0.55, rgb(mid));
  g.addColorStop(1, rgb(bot));
  ctx.fillStyle = g;
  ctx.fillRect(0,0,w,h);
}

function drawSunMoon(ctx, w, h, palette, dayFactor, timeFrac){
  const isDay = dayFactor > 0.5;
  const arcT = (timeFrac % 1);
  const x = w * arcT;
  const y = h*0.62 - Math.sin(arcT*Math.PI) * h*0.5;
  const color = isDay ? palette.sun : palette.moon;
  const alpha = isDay ? dayFactor : (1-dayFactor);
  if(alpha < 0.05) return;
  const glow = ctx.createRadialGradient(x,y,0,x,y,70);
  glow.addColorStop(0, rgba(color, 0.9*alpha));
  glow.addColorStop(0.3, rgba(color, 0.35*alpha));
  glow.addColorStop(1, rgba(color, 0));
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(x,y,70,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = rgba(color, alpha);
  ctx.beginPath(); ctx.arc(x,y, isDay?16:12, 0, Math.PI*2); ctx.fill();
}

function drawClouds(ctx, clouds, w, h, offsetX, dayFactor, dt, paused){
  clouds.forEach(cl=>{
    if(!paused) cl.x += cl.speed * dt;
    if(cl.x - cl.w > w) cl.x = -cl.w;
    const drawX = cl.x + offsetX*0.05;
    const tint = dayFactor > 0.4 ? 255 : 120;
    const a = cl.alpha * (0.5 + dayFactor*0.5);
    const g = ctx.createRadialGradient(drawX, cl.y, 0, drawX, cl.y, cl.w*0.6);
    g.addColorStop(0, `rgba(${tint},${tint},${tint},${a})`);
    g.addColorStop(1, `rgba(${tint},${tint},${tint},0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(drawX, cl.y, cl.w*0.5, cl.h, 0, 0, Math.PI*2);
    ctx.fill();
  });
}

function drawBirds(state, ctx, w, h, now, dayFactor, paused){
  if(dayFactor < 0.25) { state.birds.length = 0; return; }
  if(!paused && now > state.nextBirdAt && state.birds.length < 3){
    const fromLeft = Math.random() < 0.5;
    state.birds.push({
      x: fromLeft ? -30 : w+30, y: h*(0.18+Math.random()*0.22),
      vx: (fromLeft?1:-1) * (40+Math.random()*30),
      vy: (Math.random()-0.5)*6, wing:0
    });
    state.nextBirdAt = now + 4000 + Math.random()*8000;
  }
  ctx.strokeStyle = 'rgba(20,20,26,0.6)';
  ctx.lineWidth = 1.4;
  for(let i=state.birds.length-1;i>=0;i--){
    const b = state.birds[i];
    if(!paused){
      b.x += b.vx * (1/60); b.y += b.vy*(1/60); b.wing += 0.25;
    }
    const flap = Math.sin(b.wing)*5;
    ctx.beginPath();
    ctx.moveTo(b.x-6, b.y+flap);
    ctx.quadraticCurveTo(b.x-2, b.y-3, b.x, b.y);
    ctx.quadraticCurveTo(b.x+2, b.y-3, b.x+6, b.y+flap);
    ctx.stroke();
    if(b.x < -50 || b.x > w+50) state.birds.splice(i,1);
  }
}

function applyHeatShimmer(ctx, canvasEl, now){
  // Source rects for drawImage read raw device pixels, but ctx carries a
  // dpr transform for CSS-pixel drawing elsewhere — reset it here so the
  // slice coordinates below aren't double-scaled.
  const dpr = canvasEl.width / canvasEl.clientWidth || 1;
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  const w = canvasEl.width, h = canvasEl.height;
  const bandTop = h*0.62;
  const bandH = h - bandTop;
  const sliceH = Math.max(1, Math.round(3*dpr));
  const slices = Math.ceil(bandH/sliceH);
  for(let i=0;i<slices;i++){
    const y = Math.round(bandTop + i*sliceH);
    const depth = (y-bandTop)/bandH;
    const wobble = Math.sin(y*0.045/dpr + now*0.0022) * 3.5*dpr * depth;
    ctx.drawImage(canvasEl, 0, y, w, sliceH, wobble, y, w, sliceH);
  }
  ctx.restore();
}

function drawRain(ctx, w, h, rng){
  ctx.strokeStyle = 'rgba(200,215,230,0.18)';
  ctx.lineWidth = 1;
  for(let i=0;i<70;i++){
    const x = (rng()*w + performance.now()*0.06) % w;
    const y = (rng()*h + performance.now()*0.7) % h;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-4,y+18); ctx.stroke();
  }
}

const RAIN_RNG = mulberry32(999);

function renderScene(state, ctx, w, h, now, dt, opts){
  const city = CITIES[state.cityIndex];
  state.time += dt;
  state.dayFactor = lerp(state.dayFactor, state.dayFactorTarget, opts.reduced ? 1 : Math.min(1, dt*1.2));

  drawSky(ctx, w, h, city.palette, state.dayFactor);
  SCENES[city.id].render(ctx, w, h, state, now, dt, opts, city);

  if(city.id==='dubai' && state.dayFactor > 0.35 && !opts.reduced){
    applyHeatShimmer(ctx, ctx.canvas, now);
  }
  if(opts.rain){
    drawRain(ctx, w, h, RAIN_RNG);
  }
}
