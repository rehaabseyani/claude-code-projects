/* ============================================================
   Day/night + clock
   ============================================================ */
function getCityHourFraction(tz){
  try{
    const parts = new Intl.DateTimeFormat('en-US',{ timeZone:tz, hour:'2-digit', minute:'2-digit', hour12:false }).formatToParts(new Date());
    const h = +parts.find(p=>p.type==='hour').value;
    const m = +parts.find(p=>p.type==='minute').value;
    return (h===24?0:h) + m/60;
  }catch(e){ return new Date().getHours() + new Date().getMinutes()/60; }
}
function autoDayFactor(hourFrac){
  const sunrise=6, sunset=18.5, tr=1.5;
  if(hourFrac < sunrise-tr || hourFrac > sunset+tr) return 0;
  if(hourFrac < sunrise+tr) return smoothstep(sunrise-tr, sunrise+tr, hourFrac);
  if(hourFrac > sunset-tr) return 1-smoothstep(sunset-tr, sunset+tr, hourFrac);
  return 1;
}

/* ============================================================
   Audio engine
   ============================================================ */
const AudioEngine = (function(){
  let ctx = null, master = null;
  let volume = 0.7, muted = false;
  let currentBus = null;
  let noiseBufferCache = null;

  function ensureContext(){
    if(!ctx){
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = volume;
      master.connect(ctx.destination);
    }
    if(ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function getNoiseBuffer(){
    if(noiseBufferCache) return noiseBufferCache;
    const len = ctx.sampleRate * 4;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<len;i++) data[i] = Math.random()*2-1;
    noiseBufferCache = buf;
    return buf;
  }

  function makeBus(){
    const gainNode = ctx.createGain();
    gainNode.gain.value = 0;
    gainNode.connect(master);
    return { gainNode, timers:[], sources:[], active:true };
  }

  function disposeBus(bus, after){
    setTimeout(()=>{
      bus.active = false;
      bus.timers.forEach(id=>clearTimeout(id));
      bus.sources.forEach(s=>{ try{ s.stop(); }catch(e){} });
      try{ bus.gainNode.disconnect(); }catch(e){}
    }, after);
  }

  function startContinuous(bus, cfg){
    const src = ctx.createBufferSource();
    src.buffer = getNoiseBuffer();
    src.loop = true;
    const filter = ctx.createBiquadFilter();
    filter.type = cfg.filterType || (cfg.freq < 300 ? 'lowpass' : 'bandpass');
    filter.frequency.value = cfg.freq;
    filter.Q.value = cfg.q;
    const gain = ctx.createGain();
    gain.gain.value = cfg.gain;

    src.connect(filter).connect(gain).connect(bus.gainNode);
    src.start();
    bus.sources.push(src);

    if(cfg.ampLfoRate){
      const lfo = ctx.createOscillator();
      lfo.frequency.value = cfg.ampLfoRate;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = cfg.gain * cfg.ampLfoDepth;
      lfo.connect(lfoGain).connect(gain.gain);
      lfo.start();
      bus.sources.push(lfo);
    } else {
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 0.05 + Math.random()*0.05;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = cfg.freq * 0.15;
      lfo.connect(lfoGain).connect(filter.frequency);
      lfo.start();
      bus.sources.push(lfo);
    }
  }

  function scheduleEvents(bus, cfg){
    const loop = ()=>{
      if(!bus.active) return;
      const delay = cfg.interval[0] + Math.random()*(cfg.interval[1]-cfg.interval[0]);
      const id = setTimeout(()=>{
        if(!bus.active) return;
        const fn = SYNTH[cfg.fn];
        if(fn) fn(ctx, bus.gainNode, {
          gain: cfg.gain * (0.75 + Math.random()*0.5),
          pan: (Math.random()*2-1) * 0.8
        });
        loop();
      }, delay);
      bus.timers.push(id);
    };
    loop();
  }

  function playCity(cityIndex){
    ensureContext();
    const city = CITIES[cityIndex];
    const bus = makeBus();
    city.audio.continuous.forEach(cfg=> startContinuous(bus, cfg));
    city.audio.events.forEach(cfg=> scheduleEvents(bus, cfg));

    const now = ctx.currentTime;
    bus.gainNode.gain.cancelScheduledValues(now);
    bus.gainNode.gain.setValueAtTime(bus.gainNode.gain.value, now);
    bus.gainNode.gain.linearRampToValueAtTime(1, now+1.4);

    if(currentBus){
      const old = currentBus;
      old.gainNode.gain.cancelScheduledValues(now);
      old.gainNode.gain.setValueAtTime(old.gainNode.gain.value, now);
      old.gainNode.gain.linearRampToValueAtTime(0, now+1.2);
      disposeBus(old, 1300);
    }
    currentBus = bus;
  }

  function stopAll(){
    if(currentBus){
      const now = ctx ? ctx.currentTime : 0;
      if(ctx){
        currentBus.gainNode.gain.cancelScheduledValues(now);
        currentBus.gainNode.gain.setValueAtTime(currentBus.gainNode.gain.value, now);
        currentBus.gainNode.gain.linearRampToValueAtTime(0, now+1.0);
      }
      disposeBus(currentBus, 1100);
      currentBus = null;
    }
  }

  function setVolume(v){
    volume = v;
    if(!muted && master) master.gain.setTargetAtTime(v, ctx.currentTime, 0.05);
  }
  function setMuted(m){
    muted = m;
    if(master) master.gain.setTargetAtTime(m?0:volume, ctx.currentTime, 0.05);
  }
  function isReady(){ return !!ctx; }

  return { ensureContext, playCity, stopAll, setVolume, setMuted, isReady };
})();

/* ---- synth voices ---- */
function envGain(ctx, dest, attack, decay, peak, startAt){
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, startAt);
  g.gain.linearRampToValueAtTime(peak, startAt+attack);
  g.gain.exponentialRampToValueAtTime(0.0001, startAt+attack+decay);
  g.connect(dest);
  return g;
}
function panNode(ctx, dest, pan){
  if(ctx.createStereoPanner){
    const p = ctx.createStereoPanner();
    p.pan.value = clamp(pan,-1,1);
    p.connect(dest);
    return p;
  }
  return dest;
}

const SYNTH = {
  gull(ctx, dest, {gain=0.3, pan=0}){
    const t0 = ctx.currentTime;
    const pn = panNode(ctx, dest, pan);
    const g = envGain(ctx, pn, 0.05, 0.5, gain, t0);
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1400, t0);
    osc.frequency.exponentialRampToValueAtTime(2200, t0+0.15);
    osc.frequency.exponentialRampToValueAtTime(900, t0+0.5);
    osc.connect(g);
    osc.start(t0); osc.stop(t0+0.6);
  },
  bird(ctx, dest, {gain=0.2, pan=0}){
    const t0 = ctx.currentTime;
    const pn = panNode(ctx, dest, pan);
    for(let i=0;i<3;i++){
      const st = t0 + i*0.12;
      const g = envGain(ctx, pn, 0.01, 0.12, gain*(0.7+Math.random()*0.5), st);
      const osc = ctx.createOscillator();
      osc.type='sine';
      const f = 2200+Math.random()*1200;
      osc.frequency.setValueAtTime(f, st);
      osc.frequency.exponentialRampToValueAtTime(f*1.4, st+0.08);
      osc.connect(g);
      osc.start(st); osc.stop(st+0.15);
    }
  },
  crow(ctx, dest, {gain=0.25, pan=0}){
    const t0 = ctx.currentTime;
    const pn = panNode(ctx, dest, pan);
    const src = ctx.createBufferSource();
    const len = ctx.sampleRate*0.35;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    src.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type='bandpass'; filter.frequency.value=900; filter.Q.value=3;
    const g = envGain(ctx, filter, 0.02, 0.3, gain, t0);
    src.connect(g); filter.connect(pn);
    src.start(t0); src.stop(t0+0.4);
  },
  ferryHorn(ctx, dest, {gain=0.2, pan=0}){
    const t0 = ctx.currentTime;
    const pn = panNode(ctx, dest, pan);
    const g = envGain(ctx, pn, 0.3, 1.8, gain, t0);
    const osc = ctx.createOscillator();
    osc.type='sawtooth'; osc.frequency.value = 110;
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=300;
    osc.connect(lp).connect(g);
    osc.start(t0); osc.stop(t0+2.2);
  },
  siren(ctx, dest, {gain=0.12, pan=0}){
    const t0 = ctx.currentTime, dur=3.5;
    const pn = panNode(ctx, dest, pan);
    const g = ctx.createGain(); g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(gain, t0+0.5);
    g.gain.linearRampToValueAtTime(0, t0+dur);
    g.connect(pn);
    const osc = ctx.createOscillator(); osc.type='sine';
    osc.frequency.setValueAtTime(600, t0);
    for(let i=0;i<dur;i+=0.8){
      osc.frequency.linearRampToValueAtTime(900, t0+i+0.4);
      osc.frequency.linearRampToValueAtTime(600, t0+i+0.8);
    }
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1400;
    osc.connect(lp).connect(g);
    osc.start(t0); osc.stop(t0+dur);
  },
  helicopter(ctx, dest, {gain=0.15}){
    const t0 = ctx.currentTime, dur=6;
    const pn = ctx.createStereoPanner ? ctx.createStereoPanner() : dest;
    if(pn.connect) pn.connect(dest);
    const g = ctx.createGain(); g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(gain, t0+1.5);
    g.gain.linearRampToValueAtTime(0, t0+dur);
    g.connect(pn);
    const osc = ctx.createOscillator(); osc.type='sawtooth'; osc.frequency.value=90;
    const lfo = ctx.createOscillator(); lfo.frequency.value=11;
    const lfoGain = ctx.createGain(); lfoGain.gain.value=0.6;
    const modGain = ctx.createGain(); modGain.gain.value=0.4;
    lfo.connect(lfoGain).connect(modGain.gain);
    osc.connect(modGain).connect(g);
    lfo.start(t0); osc.start(t0);
    lfo.stop(t0+dur); osc.stop(t0+dur);
    if(pn.pan){
      pn.pan.setValueAtTime(-1, t0);
      pn.pan.linearRampToValueAtTime(1, t0+dur);
    }
  },
  constructionDistant(ctx, dest, {gain=0.1, pan=0}){
    const t0 = ctx.currentTime;
    const pn = panNode(ctx, dest, pan);
    const g = envGain(ctx, pn, 0.02, 0.25, gain, t0);
    const osc = ctx.createOscillator(); osc.type='square'; osc.frequency.value=140;
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=500;
    osc.connect(lp).connect(g);
    osc.start(t0); osc.stop(t0+0.3);
  },
  callToPrayer(ctx, dest, {gain=0.12}){
    const t0 = ctx.currentTime, dur=9;
    const g = ctx.createGain(); g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(gain, t0+2.5);
    g.gain.linearRampToValueAtTime(gain*0.7, t0+dur*0.6);
    g.gain.linearRampToValueAtTime(0, t0+dur);
    g.connect(dest);
    const freqs=[196,246.9,293.7];
    freqs.forEach((f,i)=>{
      const osc = ctx.createOscillator(); osc.type='sine'; osc.frequency.value=f;
      const vib = ctx.createOscillator(); vib.frequency.value=4.5+i*0.3;
      const vibGain = ctx.createGain(); vibGain.gain.value=2.5;
      vib.connect(vibGain).connect(osc.frequency);
      const og = ctx.createGain(); og.gain.value = 0.35/(i+1);
      osc.connect(og).connect(g);
      vib.start(t0); osc.start(t0);
      vib.stop(t0+dur); osc.stop(t0+dur);
    });
  },
  trainRumble(ctx, dest, {gain=0.2, pan=0}){
    const t0 = ctx.currentTime, dur=4.5;
    const pn = panNode(ctx, dest, pan);
    const g = ctx.createGain(); g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(gain, t0+1.2);
    g.gain.linearRampToValueAtTime(0, t0+dur);
    g.connect(pn);
    const src = ctx.createBufferSource();
    const len = ctx.sampleRate*dur;
    const buf = ctx.createBuffer(1,len,ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    src.buffer=buf;
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=220;
    src.connect(lp).connect(g);
    src.start(t0); src.stop(t0+dur);
  },
  churchBells(ctx, dest, {gain=0.2, pan=0}){
    const pn = panNode(ctx, dest, pan);
    const ring = (delay)=>{
      const t0 = ctx.currentTime+delay;
      [1,2.42,3.86,5.4].forEach((ratio,i)=>{
        const osc = ctx.createOscillator(); osc.type='sine'; osc.frequency.value=420*ratio;
        const g = ctx.createGain(); g.gain.setValueAtTime(0,t0);
        g.gain.linearRampToValueAtTime(gain/(i+1), t0+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0+2.2);
        osc.connect(g).connect(pn);
        osc.start(t0); osc.stop(t0+2.3);
      });
    };
    for(let i=0;i<4;i++) ring(i*0.9);
  },
  rickshawHorn(ctx, dest, {gain=0.22, pan=0}){
    const t0 = ctx.currentTime;
    const pn = panNode(ctx, dest, pan);
    const g = envGain(ctx, pn, 0.01, 0.18, gain, t0);
    const osc = ctx.createOscillator(); osc.type='square'; osc.frequency.value=520+Math.random()*80;
    osc.connect(g);
    osc.start(t0); osc.stop(t0+0.22);
    const t1 = t0+0.28;
    const g2 = envGain(ctx, pn, 0.01, 0.18, gain*0.8, t1);
    const osc2 = ctx.createOscillator(); osc2.type='square'; osc2.frequency.value=520+Math.random()*80;
    osc2.connect(g2);
    osc2.start(t1); osc2.stop(t1+0.22);
  },
  vendorCall(ctx, dest, {gain=0.1, pan=0}){
    const t0 = ctx.currentTime, dur=1.4;
    const pn = panNode(ctx, dest, pan);
    const g = ctx.createGain(); g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(gain, t0+0.3);
    g.gain.linearRampToValueAtTime(0, t0+dur);
    g.connect(pn);
    const osc = ctx.createOscillator(); osc.type='sawtooth';
    osc.frequency.setValueAtTime(320, t0);
    osc.frequency.linearRampToValueAtTime(420, t0+dur*0.5);
    osc.frequency.linearRampToValueAtTime(280, t0+dur);
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900;
    osc.connect(lp).connect(g);
    osc.start(t0); osc.stop(t0+dur);
  },
  distantChatter(ctx, dest, {gain=0.08, pan=0}){
    const t0 = ctx.currentTime, dur=1.8;
    const pn = panNode(ctx, dest, pan);
    const src = ctx.createBufferSource();
    const len = ctx.sampleRate*dur;
    const buf = ctx.createBuffer(1,len,ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    src.buffer=buf;
    const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1200; bp.Q.value=0.8;
    const g = ctx.createGain(); g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(gain, t0+0.3);
    g.gain.linearRampToValueAtTime(0, t0+dur);
    src.connect(bp).connect(g).connect(pn);
    src.start(t0); src.stop(t0+dur);
  },
  motorbikePass(ctx, dest, {gain=0.18, pan=0}){
    const t0 = ctx.currentTime, dur=1.6;
    const pn = ctx.createStereoPanner ? ctx.createStereoPanner() : dest;
    if(pn.connect) pn.connect(dest);
    const g = ctx.createGain(); g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(gain, t0+0.3);
    g.gain.linearRampToValueAtTime(0, t0+dur);
    g.connect(pn);
    const osc = ctx.createOscillator(); osc.type='sawtooth';
    osc.frequency.setValueAtTime(180, t0);
    osc.frequency.linearRampToValueAtTime(340, t0+dur*0.5);
    osc.frequency.linearRampToValueAtTime(140, t0+dur);
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1200;
    osc.connect(lp).connect(g);
    osc.start(t0); osc.stop(t0+dur);
    if(pn.pan){
      pn.pan.setValueAtTime(pan-0.6, t0);
      pn.pan.linearRampToValueAtTime(pan+0.6, t0+dur);
    }
  },
  planeFlyover(ctx, dest, {gain=0.1}){
    const t0 = ctx.currentTime, dur=10;
    const pn = ctx.createStereoPanner ? ctx.createStereoPanner() : dest;
    if(pn.connect) pn.connect(dest);
    const g = ctx.createGain(); g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(gain, t0+3);
    g.gain.linearRampToValueAtTime(0, t0+dur);
    g.connect(pn);
    const src = ctx.createBufferSource();
    const len = ctx.sampleRate*dur;
    const buf = ctx.createBuffer(1,len,ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    src.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=340; bp.Q.value=1.2;
    src.connect(bp).connect(g);
    src.start(t0); src.stop(t0+dur);
    if(pn.pan){
      pn.pan.setValueAtTime(-1, t0);
      pn.pan.linearRampToValueAtTime(1, t0+dur);
    }
  }
};

/* ============================================================
   App controller
   ============================================================ */
const landing = document.getElementById('landing');
const experience = document.getElementById('experience');
const citySelector = document.getElementById('citySelector');
const citySwitcher = document.getElementById('citySwitcher');
const cityTitle = document.getElementById('cityTitle');
const backBtn = document.getElementById('backBtn');
const dayNightBtn = document.getElementById('dayNightBtn');
const rainBtn = document.getElementById('rainBtn');
const muteBtn = document.getElementById('muteBtn');
const volumeSlider = document.getElementById('volumeSlider');
const clockDisplay = document.getElementById('clockDisplay');
const rainLayerEl = document.getElementById('rainLayer');
const soundscapeDesc = document.getElementById('soundscapeDesc');
const motionBtn = document.getElementById('motionBtn');
const windowRig = document.getElementById('window-rig');
const liveRegion = document.getElementById('liveRegion');

let currentCity = 0;
let dayNightMode = 'auto'; // 'auto' | 'day' | 'night'
let rainOn = false;
let inExperience = false;

let parallaxTargetX = 0, parallaxTargetY = 0;
let smoothParallaxX = 0, smoothParallaxY = 0;

/* --- Landing cards --- */
function buildLandingCards(){
  CITIES.forEach((city, i)=>{
    const btn = document.createElement('button');
    btn.className = 'city-card';
    btn.setAttribute('role','listitem');
    btn.setAttribute('aria-label', `Enter ${city.name} window view`);
    btn.tabIndex = i===0 ? 0 : -1;
    btn.dataset.index = i;

    const teaser = document.createElement('span');
    teaser.className = `teaser ${city.id === 'dc' ? 'dc' : (city.id==='philly'?'philly':city.id)}`;
    teaser.setAttribute('aria-hidden','true');

    const content = document.createElement('span');
    content.className = 'card-content';
    content.innerHTML = `<span class="card-name">${city.name}</span><span class="card-sub">${city.short}</span>`;

    btn.appendChild(teaser);
    btn.appendChild(content);
    btn.addEventListener('click', ()=> enterCity(i));
    btn.addEventListener('keydown', onCardKeydown);
    citySelector.appendChild(btn);
  });
}
function onCardKeydown(e){
  const cards = Array.from(citySelector.querySelectorAll('.city-card'));
  const idx = cards.indexOf(e.currentTarget);
  if(e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
    e.preventDefault();
    enterCity(idx);
    return;
  }
  let next = null;
  if(e.key === 'ArrowRight' || e.key === 'ArrowDown') next = (idx+1) % cards.length;
  else if(e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = (idx-1+cards.length) % cards.length;
  else if(e.key === 'Home') next = 0;
  else if(e.key === 'End') next = cards.length-1;
  if(next !== null){
    e.preventDefault();
    cards.forEach(c=> c.tabIndex = -1);
    cards[next].tabIndex = 0;
    cards[next].focus();
  }
}

/* --- Switcher --- */
function buildSwitcher(){
  citySwitcher.innerHTML = '';
  CITIES.forEach((city,i)=>{
    const b = document.createElement('button');
    b.className = 'dot-btn';
    b.textContent = city.name[0];
    b.setAttribute('aria-label', `Switch to ${city.name}`);
    b.setAttribute('aria-current', i===currentCity ? 'true':'false');
    b.addEventListener('click', ()=>{
      if(i !== currentCity) switchCity(i);
    });
    citySwitcher.appendChild(b);
  });
}
function updateSwitcher(){
  citySwitcher.querySelectorAll('.dot-btn').forEach((b,i)=>{
    b.setAttribute('aria-current', i===currentCity ? 'true':'false');
  });
}

/* --- Enter / switch / back --- */
function enterCity(index){
  currentCity = index;
  AudioEngine.ensureContext();
  AudioEngine.playCity(index);

  landing.classList.add('hidden');
  experience.classList.add('visible');
  inExperience = true;

  sizeCanvases();
  stateA = createSceneState(index, viewW, viewH);
  stateB = createSceneState(index, viewW, viewH);
  frontIsA = true;
  canvasA.style.opacity = 1; canvasB.style.opacity = 0;

  applyCityUI(index);
  buildSwitcher();
  startLoopIfNeeded();
  clockTick();
}

function switchCity(index){
  if(transitioning) return;
  currentCity = index;
  AudioEngine.playCity(index);

  const backState = frontIsA ? stateB : stateA;
  Object.assign(backState, createSceneState(index, viewW, viewH));
  backState.dayFactor = frontIsA ? stateA.dayFactor : stateB.dayFactor;
  backState.dayFactorTarget = computeTargetDayFactor(index);

  transitioning = true;
  transitionStart = performance.now();
  transitionDur = reducedMotion() ? 50 : 1100;

  applyCityUI(index);
  updateSwitcher();
}

function goBack(){
  AudioEngine.stopAll();
  experience.classList.remove('visible');
  landing.classList.remove('hidden');
  inExperience = false;
  const firstCard = citySelector.querySelector('.city-card');
  if(firstCard) firstCard.focus();
}

function applyCityUI(index){
  const city = CITIES[index];
  cityTitle.textContent = city.name;
  soundscapeDesc.textContent = city.description;
  windowRig.setAttribute('aria-label', `First-person window view overlooking ${city.name}`);
  announce(`${city.name} window selected.`);
}

function announce(msg){ liveRegion.textContent = msg; }

/* --- day/night --- */
function computeTargetDayFactor(index){
  if(dayNightMode === 'day') return 1;
  if(dayNightMode === 'night') return 0;
  // Auto mode uses the viewer's own local time for every city, rather than
  // each city's real timezone, so lighting stays in sync when switching —
  // the per-city clock display still shows each city's true local time.
  const now = new Date();
  return autoDayFactor(now.getHours() + now.getMinutes()/60);
}
function refreshDayNightTargets(){
  if(stateA) stateA.dayFactorTarget = computeTargetDayFactor(stateA.cityIndex);
  if(stateB) stateB.dayFactorTarget = computeTargetDayFactor(stateB.cityIndex);
}
dayNightBtn.addEventListener('click', ()=>{
  dayNightMode = dayNightMode === 'auto' ? 'day' : dayNightMode === 'day' ? 'night' : 'auto';
  dayNightBtn.textContent = dayNightMode === 'auto' ? 'Auto' : dayNightMode === 'day' ? 'Day' : 'Night';
  dayNightBtn.setAttribute('aria-pressed', dayNightMode !== 'auto' ? 'true':'false');
  refreshDayNightTargets();
});

/* --- rain --- */
function buildRainDom(){
  rainLayerEl.innerHTML = '';
  for(let i=0;i<18;i++){
    const d = document.createElement('div');
    d.className = 'drop';
    d.style.left = (Math.random()*100) + '%';
    d.style.animationDuration = (0.6+Math.random()*0.5)+'s';
    d.style.animationDelay = (-Math.random()*2)+'s';
    d.style.height = (16+Math.random()*22)+'px';
    rainLayerEl.appendChild(d);
  }
}
buildRainDom();
rainBtn.addEventListener('click', ()=>{
  rainOn = !rainOn;
  rainBtn.setAttribute('aria-pressed', String(rainOn));
  rainLayerEl.classList.toggle('on', rainOn);
});

/* --- audio controls --- */
muteBtn.addEventListener('click', ()=>{
  const pressed = muteBtn.getAttribute('aria-pressed') === 'true';
  const next = !pressed;
  muteBtn.setAttribute('aria-pressed', String(next));
  muteBtn.textContent = next ? '\u{1F507}' : '\u{1F50A}';
  AudioEngine.setMuted(next);
});
volumeSlider.addEventListener('input', (e)=>{
  AudioEngine.setVolume(clamp(+e.target.value/100, 0, 1));
});

/* --- back / nav --- */
backBtn.addEventListener('click', goBack);

/* --- clock --- */
function clockTick(){
  if(!inExperience) return;
  const city = CITIES[currentCity];
  try{
    const str = new Intl.DateTimeFormat('en-US',{ timeZone:city.tz, hour:'2-digit', minute:'2-digit', hour12:false }).format(new Date());
    clockDisplay.textContent = str;
  }catch(e){ clockDisplay.textContent = '--:--'; }
  refreshDayNightTargets();
}
setInterval(clockTick, 15000);

/* --- pointer / touch / device orientation parallax --- */
window.addEventListener('mousemove', (e)=>{
  if(!inExperience || reducedMotion()) return;
  parallaxTargetX = (e.clientX / window.innerWidth) * 2 - 1;
  parallaxTargetY = (e.clientY / window.innerHeight) * 2 - 1;
});

let touchStartX = null, touchStartY = null;
windowRig.addEventListener('touchstart', (e)=>{
  if(e.touches.length){ touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }
}, {passive:true});
windowRig.addEventListener('touchmove', (e)=>{
  if(touchStartX===null || reducedMotion()) return;
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  parallaxTargetX = clamp(-dx/120, -1, 1);
  parallaxTargetY = clamp(-dy/120, -1, 1);
}, {passive:true});
windowRig.addEventListener('touchend', ()=>{
  touchStartX = null; touchStartY = null;
  parallaxTargetX = 0; parallaxTargetY = 0;
});

let motionGranted = false;
function needsMotionPermission(){
  return typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function';
}
function enableOrientation(){
  window.addEventListener('deviceorientation', (e)=>{
    if(!inExperience || reducedMotion()) return;
    if(e.beta==null || e.gamma==null) return;
    parallaxTargetX = clamp(e.gamma/30, -1, 1);
    parallaxTargetY = clamp((e.beta-45)/40, -1, 1);
  });
  motionGranted = true;
  motionBtn.classList.remove('show');
}
if(needsMotionPermission()){
  motionBtn.classList.add('show');
  motionBtn.addEventListener('click', ()=>{
    DeviceOrientationEvent.requestPermission().then(res=>{
      if(res === 'granted') enableOrientation();
    }).catch(()=>{});
  });
} else if(typeof DeviceOrientationEvent !== 'undefined'){
  enableOrientation();
}

/* --- resize --- */
let resizeTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    if(inExperience) sizeCanvases();
  }, 150);
});

/* ============================================================
   Main animation loop
   ============================================================ */
let lastTs = null;
let loopStarted = false;

function startLoopIfNeeded(){
  if(loopStarted) return;
  loopStarted = true;
  requestAnimationFrame(tick);
}

function tick(ts){
  requestAnimationFrame(tick);
  if(!inExperience){ lastTs = ts; return; }
  if(document.hidden){ lastTs = ts; return; }
  const dt = lastTs ? Math.min((ts-lastTs)/1000, 0.05) : 0;
  lastTs = ts;

  const rm = reducedMotion();
  const ease = rm ? 1 : Math.min(1, dt*5);
  smoothParallaxX = lerp(smoothParallaxX, parallaxTargetX, ease);
  smoothParallaxY = lerp(smoothParallaxY, parallaxTargetY, ease);

  if(stateA){ stateA.parallaxX = smoothParallaxX; stateA.parallaxY = smoothParallaxY; if(stateA.dayFactorTarget===undefined) stateA.dayFactorTarget = computeTargetDayFactor(stateA.cityIndex); }
  if(stateB){ stateB.parallaxX = smoothParallaxX; stateB.parallaxY = smoothParallaxY; }

  const opts = { reduced: rm, rain: rainOn };

  if(transitioning){
    const t = clamp((performance.now()-transitionStart)/transitionDur, 0, 1);
    const eased = t*t*(3-2*t);
    renderScene(stateA, ctxA, viewW, viewH, ts, dt, opts);
    renderScene(stateB, ctxB, viewW, viewH, ts, dt, opts);
    if(frontIsA){
      canvasA.style.opacity = 1-eased;
      canvasB.style.opacity = eased;
    } else {
      canvasA.style.opacity = eased;
      canvasB.style.opacity = 1-eased;
    }
    if(t >= 1){
      transitioning = false;
      frontIsA = !frontIsA;
    }
  } else {
    const front = frontIsA ? stateA : stateB;
    const frontCtx = frontIsA ? ctxA : ctxB;
    if(front) renderScene(front, frontCtx, viewW, viewH, ts, dt, opts);
  }
}

/* ============================================================
   Init
   ============================================================ */
buildLandingCards();

})();
</script>
</body>
</html>
